<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portafolio - Franco Fernández</title>
</head>
<body>

  <!-- Todo el código JavaScript va dentro de esta etiqueta -->
  <script>
    const PERFIL = {
      nombre: "Franco Fernandez Valencia",
      cargo: "Estudiante de Ingeniería de Sistemas",
      resumen: "Enfocado en Desarrollo de Software, Bases de Datos y Soluciones Web.",
      foto: "assets/foto-perfil.jpg",
      email: "022100691k@uandina.edu.pe",
      anio: new Date().getFullYear(),
    };

    const REDES = [
      { nombre: "GitHub", url: "https://github.com/FrancoFernandezValencia1" },
      { nombre: "LinkedIn", url: "https://www.linkedin.com/in/franco-fernandez-valencia-2283ba302/" },
    ];

    const HABILIDADES = [
      {
        titulo: "Lenguajes & Frontend",
        items: ["JavaScript (ES6+)", "HTML5", "CSS3", "Python", "Java", "SQL"],
      },
      {
        titulo: "Bases de Datos & Herramientas",
        items: ["PostgreSQL", "MySQL", "Git & GitHub", "VS Code", "Linux / Bash"],
      },
    ];

    const PROYECTOS = [
      {
        titulo: "Sistema de Inventario",
        categoria: "sistemas",
        tech: "HTML, CSS, JavaScript",
        desc: "CRUD básico con LocalStorage.",
        link: "https://github.com",
      },
      {
        titulo: "Clon de Calculadora",
        categoria: "sistemas",
        tech: "JavaScript puro",
        desc: "Operaciones matemáticas con validación segura.",
        link: "https://github.com",
      },
      {
        titulo: "Dashboard de Clima",
        categoria: "sistemas",
        tech: "Fetch API + OpenWeather",
        desc: "Consume una API REST pública.",
        link: "https://github.com",
      },
      {
        titulo: "Sistema integrado para restaurante Kaypi",
        categoria: "web",
        tech: "PHP, Laravel, Blade, Tailwind, Alpine.js",
        desc: "Herramienta visual interactiva para simular algoritmos del sistema operativo como FCFS, SJF y Round Robin.",
        link: "https://github.com/FrancoFernandezValencia1",
      },
    ];

    const FILTROS = [
      { valor: "todos", texto: "Todos" },
      { valor: "web", texto: "Web" },
      { valor: "sistemas", texto: "Sistemas / Lógica" },
    ];

    /* --- CSS INYECTADO --- */
    const CSS = `
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { --bg: #f5f6f8; --card: #ffffff; --texto: #1c1e21; --gris: #5a6472; --acento: #2563eb; --borde: #e2e6ec; }
      body.dark-mode { --bg: #12141a; --card: #1b1e26; --texto: #eef1f6; --gris: #9aa4b5; --acento: #3b82f6; --borde: #2a2f3a; }
      html { scroll-behavior: smooth; }
      body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--texto); transition: background .3s, color .3s; }
      .container { max-width: 1100px; margin: auto; padding: 60px 20px; }
      .section-alt { background: var(--card); }
      a { color: var(--acento); text-decoration: none; }
      h1, h2, h3 { line-height: 1.3; }

      /* Header */
      .header { position: sticky; top: 0; z-index: 100; background: var(--card); border-bottom: 1px solid var(--borde); }
      .header-container { max-width: 1100px; margin: auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
      .logo { font-weight: 700; color: var(--texto); }
      .nav ul { display: flex; gap: 20px; list-style: none; }
      .nav a { color: var(--gris); font-size: 15px; }
      .nav a:hover, .nav a.activo { color: var(--acento); font-weight: bold; }
      .header-actions { display: flex; gap: 8px; }
      .theme-btn, .menu-btn { background: transparent; border: 1px solid var(--borde); color: var(--texto); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 14px; }
      .menu-btn { display: none; }

      /* Hero */
      .hero { text-align: center; padding: 90px 20px 60px; }
      .profile-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid var(--acento); }
      .hero h1 { font-size: 38px; margin: 22px 0 10px; }
      .highlight { color: var(--acento); }
      .hero-subtitle { color: var(--gris); max-width: 620px; margin: auto; }
      .hero-buttons { margin-top: 26px; display: flex; gap: 12px; justify-content: center; }
      .btn { padding: 11px 24px; border-radius: 8px; font-weight: 600; display: inline-block; }
      .btn-primary { background: var(--acento); color: #fff; }
      .btn-secondary { border: 1px solid var(--acento); color: var(--acento); }

      /* Secciones */
      .section-title { font-size: 30px; text-align: center; margin-bottom: 12px; }
      .section-subtitle { text-align: center; color: var(--gris); margin-bottom: 26px; }
      .about-grid, .skills-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      .about-card, .skill-category, .card-proyecto { background: var(--bg); border: 1px solid var(--borde); border-radius: 12px; padding: 22px; }
      .section-alt .about-card, .section-alt .skill-category { background: var(--bg); }
      .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .tag { background: var(--acento); color: #fff; border-radius: 20px; padding: 5px 13px; font-size: 13px; }

      /* Proyectos */
      .filters { display: flex; gap: 10px; justify-content: center; margin-bottom: 28px; }
      .filter-btn { background: var(--card); border: 1px solid var(--borde); color: var(--gris); padding: 9px 20px; border-radius: 20px; cursor: pointer; }
      .filter-btn.active { background: var(--acento); border-color: var(--acento); color: #fff; }
      .grid-proyectos { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      .card-proyecto h3 { margin-bottom: 8px; }
      .tech-badge { background: var(--acento); color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 5px; }
      .card-proyecto p { color: var(--gris); font-size: 15px; margin: 10px 0 14px; }
      .card-link { font-weight: 600; }

      /* Contacto */
      .contact-wrapper { display: grid; gap: 30px; grid-template-columns: 1fr 1fr; }
      .form-group { margin-bottom: 16px; }
      .form-group label { display: block; font-size: 14px; margin-bottom: 6px; }
      .form-group input, .form-group textarea { width: 100%; padding: 11px; border: 1px solid var(--borde); border-radius: 8px; background: var(--card); color: var(--texto); font-family: inherit; }
      .btn-block { width: 100%; border: none; cursor: pointer; }
      .error-msg { color: #e04b4b; font-size: 13px; display: block; margin-top: 4px; }
      .form-feedback { margin-top: 12px; font-size: 14px; }
      .form-feedback.success { color: #2e9e5b; }
      .social-links ul { list-style: none; margin-top: 14px; }
      .social-links li { margin-bottom: 9px; color: var(--gris); }

      /* Footer */
      .footer { text-align: center; padding: 26px; color: var(--gris); background: var(--card); border-top: 1px solid var(--borde); font-size: 14px; }

      /* Responsive */
      @media (max-width: 820px) {
        .contact-wrapper { grid-template-columns: 1fr; }
        .menu-btn { display: block; }
        .nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--card); border-bottom: 1px solid var(--borde); }
        .nav.active { display: block; }
        .nav ul { flex-direction: column; gap: 0; padding: 10px 20px; }
        .nav a { display: block; padding: 12px 0; }
        .hero h1 { font-size: 27px; }
      }
    `;

    /* --- FUNCIONES UTILITARIAS --- */
    const $ = (sel) => document.querySelector(sel);
    const crear = (tag, clase, html) => {
      const el = document.createElement(tag);
      if (clase) el.className = clase;
      if (html !== undefined) el.innerHTML = html;
      return el;
    };

    /* --- CONSTRUCCIÓN DEL HTML --- */
    function construirPagina() {
      const enlaceCss = crear("style", "", CSS);
      document.head.appendChild(enlaceCss);

      document.title = PERFIL.nombre + " | Portafolio";

      /* Header */
      const header = crear("header", "header");
      header.innerHTML = `
        <div class="header-container">
          <a href="#inicio" class="logo">${PERFIL.nombre.split(" ")[0]}Dev</a>
          <div class="header-actions">
            <button id="theme-toggle" class="theme-btn">Tema</button>
            <button id="menu-toggle" class="menu-btn">&#9776;</button>
          </div>
          <nav id="nav-menu" class="nav">
            <ul>
              <li><a href="#inicio">Inicio</a></li>
              <li><a href="#sobre-mi">Sobre Mí</a></li>
              <li><a href="#habilidades">Habilidades</a></li>
              <li><a href="#proyectos">Proyectos</a></li>
              <li><a href="#contacto">Contacto</a></li>
            </ul>
          </nav>
        </div>`;

      /* Hero */
      const hero = `
        <section id="inicio" class="hero">
          <img id="foto" src="${PERFIL.foto}" alt="Foto de perfil" class="profile-img">
          <h1>Hola, soy <span class="highlight">${PERFIL.nombre}</span></h1>
          <p class="hero-subtitle">${PERFIL.cargo} | ${PERFIL.resumen}</p>
          <div class="hero-buttons">
            <a href="#proyectos" class="btn btn-primary">Ver Proyectos</a>
            <a href="#contacto" class="btn btn-secondary">Contactar</a>
          </div>
        </section>`;

      /* Sobre mí */
      const sobreMi = `
        <section id="sobre-mi" class="section">
          <div class="container">
            <h2 class="section-title">Sobre Mí</h2>
            <div class="about-grid">
              <article class="about-card">
                <h3>Formación Académica</h3>
                <p>Estudiante apasionado de Ingeniería de Sistemas. Me formo continuamente en arquitectura de software, algoritmia y buenas prácticas de programación.</p>
              </article>
              <article class="about-card">
                <h3>Enfoque Técnico</h3>
                <p>Me enfoco en el desarrollo de aplicaciones eficientes, estructuradas y escalables, aplicando patrones de diseño y código limpio.</p>
              </article>
              <article class="about-card">
                <h3>Meta Profesional</h3>
                <p>Busco colaborar en proyectos desafiantes donde pueda aplicar mis conocimientos en desarrollo web, gestión de datos y lógica de sistemas.</p>
              </article>
            </div>
          </div>
        </section>`;

      /* Habilidades */
      const habilidades = `
        <section id="habilidades" class="section section-alt">
          <div class="container">
            <h2 class="section-title">Habilidades Técnicas</h2>
            <div class="skills-grid">
              ${HABILIDADES.map((g) => `
                <article class="skill-category">
                  <h3>${g.titulo}</h3>
                  <div class="tags">
                    ${g.items.map((i) => `<span class="tag">${i}</span>`).join("")}
                  </div>
                </article>`).join("")}
            </div>
          </div>
        </section>`;

      /* Proyectos */
      const proyectos = `
        <section id="proyectos" class="section">
          <div class="container">
            <h2 class="section-title">Mis Proyectos</h2>
            <p class="section-subtitle">Explora los proyectos que he desarrollado durante mi carrera:</p>
            <div class="filters">
              ${FILTROS.map((f, i) => `
                <button class="filter-btn ${i === 0 ? "active" : ""}" data-filter="${f.valor}">${f.texto}</button>`).join("")}
            </div>
            <div class="grid-proyectos" id="grid-proyectos"></div>
          </div>
        </section>`;

      /* Contacto */
      const contacto = `
        <section id="contacto" class="section section-alt">
          <div class="container">
            <h2 class="section-title">Contacto</h2>
            <div class="contact-wrapper">
              <form id="contact-form" class="contact-form" novalidate>
                <div class="form-group">
                  <label for="nombre">Nombre completo</label>
                  <input type="text" id="nombre" placeholder="Tu nombre">
                  <small class="error-msg"></small>
                </div>
                <div class="form-group">
                  <label for="email">Correo electrónico</label>
                  <input type="email" id="email" placeholder="tu.correo@ejemplo.com">
                  <small class="error-msg"></small>
                </div>
                <div class="form-group">
                  <label for="mensaje">Mensaje</label>
                  <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
                  <small class="error-msg"></small>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Enviar Mensaje</button>
                <div id="form-feedback" class="form-feedback"></div>
              </form>

              <div class="social-links">
                <h3>Información de Contacto</h3>
                <p>¿Tienes un proyecto en mente? Puedes escribirme por aquí:</p>
                <ul>
                  ${REDES.map((r) => `
                    <li><strong>${r.nombre}:</strong> <a href="${r.url}" target="_blank" rel="noopener">${r.url.replace("https://", "")}</a></li>`).join("")}
                  <li><strong>Email:</strong> ${PERFIL.email}</li>
                </ul>
              </div>
            </div>
          </div>
        </section>`;

      /* Footer */
      const footer = `
        <footer class="footer">
          <p>&copy; ${PERFIL.anio} ${PERFIL.nombre} — ${PERFIL.cargo}. Todos los derechos reservados.</p>
        </footer>`;

      const main = crear("main", "", hero + sobreMi + habilidades + proyectos + contacto);
      document.body.appendChild(header);
      document.body.appendChild(main);
      document.body.appendChild(crear("footer", "", footer));

      document.getElementById("foto").onerror = function () {
        this.src = "https://via.placeholder.com/150";
      };
    }

    /* RENDERIZADO DE PROYECTOS */
    function renderizarProyectos(lista) {
      const cont = $("#grid-proyectos");
      cont.innerHTML = "";

      if (lista.length === 0) {
        cont.innerHTML = "<p>No hay proyectos en esta categoría.</p>";
        return;
      }

      lista.forEach((p) => {
        cont.appendChild(
          crear(
            "article",
            "card-proyecto",
            `<h3>${p.titulo}</h3>
             <span class="tech-badge">${p.tech}</span>
             <p>${p.desc}</p>
             <a href="${p.link}" target="_blank" rel="noopener" class="card-link">Ver proyecto &rarr;</a>`
          )
        );
      });
    }

    function iniciarFiltros() {
      const botones = document.querySelectorAll(".filter-btn");
      botones.forEach((btn) => {
        btn.addEventListener("click", () => {
          botones.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const cat = btn.dataset.filter;
          renderizarProyectos(
            cat === "todos" ? PROYECTOS : PROYECTOS.filter((p) => p.categoria === cat)
          );
        });
      });
    }

    /* MODO OSCURO */
    function iniciarTema() {
      const btn = $("#theme-toggle");
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
      }
      btn.textContent = document.body.classList.contains("dark-mode") ? "Claro" : "Oscuro";

      btn.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        const oscuro = document.body.classList.contains("dark-mode");
        btn.textContent = oscuro ? "Claro" : "Oscuro";
        localStorage.setItem("theme", oscuro ? "dark" : "light");
      });
    }

    /* MENÚ MÓVIL */
    function iniciarMenu() {
      const btn = $("#menu-toggle");
      const nav = $("#nav-menu");
      btn.addEventListener("click", () => nav.classList.toggle("active"));
      document.querySelectorAll(".nav a").forEach((a) =>
        a.addEventListener("click", () => nav.classList.remove("active"))
      );
    }

    /* VALIDACIÓN DE FORMULARIO */
    function mostrarError(input, texto) {
      const cible = input.nextElementSibling;
      if (cible) cible.textContent = texto;
    }

    function iniciarFormulario() {
      const form = $("#contact-form");
      const feedback = $("#form-feedback");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const nombre = $("#nombre");
        const email = $("#email");
        const mensaje = $("#mensaje");
        let ok = true;

        document.querySelectorAll(".error-msg").forEach((el) => (el.textContent = ""));

        if (nombre.value.trim() === "") {
          mostrarError(nombre, "El nombre es obligatorio.");
          ok = false;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
          mostrarError(email, "Ingresa un correo electrónico válido.");
          ok = false;
        }
        if (mensaje.value.trim().length < 10) {
          mostrarError(mensaje, "El mensaje debe tener al menos 10 caracteres.");
          ok = false;
        }

        if (ok) {
          feedback.className = "form-feedback success";
          feedback.textContent = "¡Gracias por tu mensaje! Me pondré en contacto contigo pronto.";
          form.reset();
          setTimeout(() => {
            feedback.className = "form-feedback";
            feedback.textContent = "";
          }, 5000);
        }
      });
    }

    /* SCROLLSPY */
    function iniciarScrollSpy() {
      const secciones = document.querySelectorAll("main section");
      const enlaces = document.querySelectorAll(".nav a");

      window.addEventListener("scroll", () => {
        let actual = "";
        secciones.forEach((s) => {
          if (window.scrollY >= s.offsetTop - 120) actual = s.id;
        });
        enlaces.forEach((a) =>
          a.classList.toggle("activo", a.getAttribute("href") === "#" + actual)
        );
      });
    }

    /* INICIALIZACIÓN GLOBAL */
    document.addEventListener("DOMContentLoaded", () => {
      construirPagina();
      renderizarProyectos(PROYECTOS);
      iniciarFiltros();
      iniciarTema();
      iniciarMenu();
      iniciarFormulario();
      iniciarScrollSpy();
    });
  </script>
</body>
</html>
